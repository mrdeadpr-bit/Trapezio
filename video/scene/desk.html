<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";

import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { FXAAShader } from "three/addons/shaders/FXAAShader.js";

const W = 1080, H = 1920;
const TL = window.TIMELINE;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.getElementById("wrap").prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4a5a8c);
const camera = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);

// ---------- texturas de pixel (estilo bloco) ----------
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function pixTex(base, vari, { w = 16, h = 16, seed = 1, rep = [1, 1], paint = null } = {}) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); const r = rng(seed); const col = new THREE.Color(base).convertLinearToSRGB();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = 1 + (r() - 0.5) * vari;
    g.fillStyle = `rgb(${Math.min(255, col.r * 255 * k) | 0},${Math.min(255, col.g * 255 * k) | 0},${Math.min(255, col.b * 255 * k) | 0})`;
    g.fillRect(x, y, 1, 1);
  }
  if (paint) paint(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 8;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); return t;
}
const cache = {};
function mat(hex, { vari: _v = 0, rough = 0.95, rep = [1, 1], seed = 3, emissive = 0, plain = false, paint = null } = {}) {
  const vari = 0; const key = [hex, vari, rough, rep, seed, emissive, plain].join("|"); if (!paint && cache[key]) return cache[key];
  const m = new THREE.MeshStandardMaterial({ map: (plain || !paint) ? null : pixTex(hex, vari, { rep, seed, paint }), color: (plain || !paint) ? hex : 0xffffff, roughness: rough, metalness: 0 });
  if (emissive) { m.emissive = new THREE.Color(hex); m.emissiveIntensity = emissive; if (m.map) m.emissiveMap = m.map; }
  if (!paint) cache[key] = m; return m;
}
function box(w, h, d, material, x, y, z, parent = scene, { cast = true, receive = true } = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = receive; parent.add(m); return m;
}
const big = (hex, w, h, d, o = {}) => mat(hex, { rep: [Math.max(1, w / 2.2), Math.max(1, h / 2.2)], ...o });

// ---------- rostos (textura de pixel dinâmica) ----------
const MASC = "#e8744c", SKIN = "#f3d3bd", SKIN_S = "#e6b99f", BROW = "#2b1d18", BAG = "#c79fb0";
function faceCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; return { c, g: c.getContext("2d"), t }; }
const UF = faceCanvas(16, 16), MF = faceCanvas(24, 16);
function px(g, col, x, y, w = 1, h = 1) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function drawUserFace(e, talk, blink) {
  const g = UF.g; px(g, SKIN, 0, 0, 16, 16);
  const brow = { flat: [[5, 5, 5, 5], [5, 5, 5, 5]], worry: [[6, 5, 5, 5], [5, 5, 5, 6]], angry: [[5, 5, 6, 6], [6, 6, 5, 5]], high: [[4, 4, 4, 4], [4, 4, 4, 4]], sly: [[5, 5, 5, 5], [4, 4, 4, 4]] }[e.brow] || [[5, 5, 5, 5], [5, 5, 5, 5]];
  brow[0].forEach((y, i) => px(g, BROW, 2 + i, y)); brow[1].forEach((y, i) => px(g, BROW, 10 + i, y));
  const eyes = blink ? "closed" : e.eyes;
  [[2, 1], [10, -1]].forEach(([x0, dir]) => {
    if (eyes === "closed") { px(g, "#3b2a24", x0, 8, 4, 1); if (e.eyes === "closed") px(g, "#3b2a24", x0 + 1, 9, 2, 1); }
    else {
      const hgt = eyes === "wide" ? 4 : eyes === "half" ? 2 : 3, y0 = eyes === "wide" ? 6 : eyes === "half" ? 8 : 7;
      px(g, "#ffffff", x0, y0, 4, hgt);
      if (eyes === "half") px(g, SKIN_S, x0, y0 - 1, 4, 1);
      const ps = eyes === "wide" ? 1 : 2;
      px(g, "#14141a", Math.min(x0 + 4 - ps, Math.max(x0, x0 + 1 + (e.look || 0))), y0 + (hgt > 2 ? 1 : 0), ps, Math.min(ps, hgt - (hgt > 2 ? 1 : 0)));
    }
    px(g, BAG, x0, 10, 4, 1);                                                                   // olheiras
  });
  px(g, SKIN_S, 7, 9, 2, 2); px(g, "#d9a98c", 7, 11, 2, 1);
  if (e.blush) { px(g, "#f2a9a0", 2, 11, 2, 1); px(g, "#f2a9a0", 12, 11, 2, 1); }

  else if (e.mouth === "smile") { px(g, "#8c3f43", 5, 12, 6, 1); px(g, "#8c3f43", 4, 11, 1, 1); px(g, "#8c3f43", 11, 11, 1, 1); if (open) px(g, "#ffffff", 6, 13, 4, 1); }
  else if (e.mouth === "o") { px(g, "#5a1f24", 6, 12, 4, 3); px(g, "#c4605f", 7, 14, 2, 1); }
  else if (e.mouth === "frown") { px(g, "#8c3f43", 5, 13, 6, 1); px(g, "#8c3f43", 4, 14, 1, 1); px(g, "#8c3f43", 11, 14, 1, 1); }
  else px(g, "#9a4a4c", 5, 13, 6, 1);
  if (e.sweat) { px(g, "#7fd0ff", 14, 6, 1, 2); px(g, "#bfe9ff", 14, 6, 1, 1); }

}
function drawMascotFace(m, blink) {
  const g = MF.g; px(g, MASC, 0, 0, 24, 16);
  const h = blink ? 1 : (m.big ? 5 : 4), y0 = blink ? 7 : (m.big ? 4 : 5);
  [4, 18].forEach(x0 => {
    px(g, "#17101a", x0, y0, 2, h);
    if (m.lid && !blink) px(g, MASC, x0, y0, 2, m.lid);
  });
  if (m.happy) [4, 18].forEach(x0 => { px(g, MASC, x0 - 1, 4, 4, 5); px(g, "#17101a", x0, 6, 2, 1); px(g, "#17101a", x0 - 1, 7, 1, 1); px(g, "#17101a", x0 + 2, 7, 1, 1); });
  px(g, "#c9603a", 10, 11, 4, 1);
  MF.t.needsUpdate = true;
}

// ---------- você ----------
const HOOD = 0x356f73, HOOD_D = 0x2a5a5e, JEANS = 0x20263a;
const user = new THREE.Group(); user.position.set(-1.1, 1.5, 0.2); user.rotation.y = -0.38; scene.add(user);
const U = {};
U.torso = box(0.85, 1.45, 1.4, mat(HOOD, { vari: 0.16, seed: 51 }), 0, 0.77, 0, user);
box(0.88, 0.24, 1.42, mat(HOOD_D, { vari: 0.16, seed: 52 }), 0, 0.12, 0, user);
box(0.07, 0.6, 0.07, mat(0xf0f0f0, { plain: true }), 0.45, 1.0, -0.13, user); box(0.07, 0.6, 0.07, mat(0xf0f0f0, { plain: true }), 0.45, 1.0, 0.13, user);
box(0.3, 0.95, 0.95, mat(HOOD_D, { vari: 0.16, seed: 53 }), -0.22, 1.3, 0, user, { cast: false });
U.head = new THREE.Group(); U.head.position.set(0.05, 2.0, 0); user.add(U.head);
const hairM = new THREE.MeshStandardMaterial({ color: 0x08080a, emissive: 0x17171c, emissiveIntensity: 1, roughness: 1 }), skinM = mat(0xf3d3bd, { vari: 0.05, seed: 62 });
const sideM = mat(0xf3d3bd, { seed: 63, paint: (g) => { g.fillStyle = "#e0b095"; g.fillRect(8, 8, 3, 3); } });
const faceM = new THREE.MeshStandardMaterial({ map: UF.t, roughness: 0.9 });
const headMats = [faceM, hairM, hairM, skinM, sideM, sideM];  // +x rosto, -x nuca, +y topo, -y, ±z lados
box(1.1, 1.1, 1.1, headMats, 0, 0, 0, U.head);
box(1.18, 0.40, 1.18, hairM, -0.02, 0.60, 0, U.head);                    // casquete
box(0.12, 0.62, 1.18, hairM, -0.58, 0.14, 0, U.head, { cast: false });   // nuca
box(0.75, 0.50, 1.16, hairM, -0.20, 0.25, 0, U.head, { cast: false });   // laterais
{ const pw = 1.1 / 16, hs = [4, 4, 3, 4, 3, 3, 2, 3, 4, 3, 3, 2, 3, 4, 4, 4];   // franja irregular
  hs.forEach((hh, x) => box(0.05, hh * pw, pw, hairM, 0.58, 0.55 - hh * pw / 2, 0.55 - (x + 0.5) * pw, U.head, { cast: false }));
  [0, 15].forEach(x => box(0.05, 3 * pw, pw, hairM, 0.58, 0.55 - 5.5 * pw, 0.55 - (x + 0.5) * pw, U.head, { cast: false })); }
// braços
U.arms = [-1, 1].map(s => {
  const g = new THREE.Group(); g.position.set(0, 1.28, s * 0.92); user.add(g);
  const up = box(0.36, 1.0, 0.36, mat(HOOD, { vari: 0.16, seed: 70 + s }), 0.17, -0.45, 0, g); up.rotation.z = 0.45;
  const fo = box(1.0, 0.32, 0.32, mat(HOOD, { vari: 0.16, seed: 72 + s }), 0.68, -0.92, 0, g);
  box(0.3, 0.26, 0.28, skinM, 0.58, -0.02, 0, fo); g.userData.fo = fo; g.userData.base = g.position.y; return g;
});
[-1, 1].forEach(s => {
  box(1.35, 0.48, 0.50, mat(JEANS), 0.7, -0.15, s * 0.45, user);
  box(0.50, 1.2, 0.48, mat(JEANS), 1.28, -0.88, s * 0.45, user);
  box(0.85, 0.3, 0.54, mat(0xf0f0f0, { vari: 0.08, seed: 82 }), 1.5, -1.46, s * 0.45, user);
});
const lapGroup = new THREE.Group(); lapGroup.position.set(0.95, 0.2, 0); user.add(lapGroup);
box(1.1, 0.07, 1.4, mat(0xc9ccd4, { plain: true, rough: 0.4 }), 0, 0, 0, lapGroup);
box(0.8, 0.02, 1.2, mat(0x2b2d35, { plain: true }), -0.05, 0.05, 0, lapGroup, { cast: false });
const hinge = new THREE.Group(); hinge.position.set(0.52, 0.04, 0); hinge.rotation.z = -0.22; lapGroup.add(hinge);
const scrCanvas = document.createElement("canvas"); scrCanvas.width = 2048; scrCanvas.height = 1536;
const scrCtx = scrCanvas.getContext("2d"); const scrTex = new THREE.CanvasTexture(scrCanvas); scrTex.colorSpace = THREE.SRGBColorSpace; scrTex.anisotropy = 16;
const alu = mat(0xc9ccd4, { plain: true, rough: 0.4 }); const scrMat = new THREE.MeshBasicMaterial({ map: scrTex }); scrMat.color.setRGB(1.25, 1.25, 1.3);
box(0.06, 1.05, 1.4, [alu, scrMat, alu, alu, alu, alu], 0, 0.52, 0, hinge);

function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return { canvas: c, tex: t }; }

// ---------- Claude (mascote) ----------
const SETN = (window.TIMELINE && window.TIMELINE.set) || "night";
const HAS_COMP = TL.lines.some(l => l.who === "x" || (l.shot && l.shot.name === "cuComp"));
const mascot = new THREE.Group(); mascot.position.set(3.2, 2.38, -0.15); mascot.rotation.y = Math.PI + 0.42; scene.add(mascot);
const M = {}; M.body = new THREE.Group(); mascot.add(M.body);
const orange = mat(0xe8744c, { emissive: 0.2 });
M.faceMat = new THREE.MeshStandardMaterial({ map: MF.t, roughness: 0.9, emissive: new THREE.Color(0xffffff), emissiveMap: MF.t, emissiveIntensity: 0.2 });
box(1.45, 1.35, 2.1, [M.faceMat, orange, orange, orange, orange, orange], 0, 1.35, 0, M.body);
M.legs = [[-0.5, -0.7], [-0.5, 0.7], [0.45, -0.7], [0.45, 0.7]].map(p => box(0.36, 0.7, 0.36, mat(0xf08a60), p[0], 0.35, p[1], mascot));
M.armR = box(0.3, 0.6, 0.3, orange, 0.15, 1.25, 1.2, M.body); M.armL = box(0.3, 0.6, 0.3, orange, 0.15, 1.25, -1.2, M.body);

// ---------- concorrente: Codex (nuvem de cristal low-poly azul/roxo com ">_" grande) ----------
const comp = new THREE.Group(); comp.position.set(6.0, 2.38, 0.0); comp.rotation.y = Math.PI + 0.72; comp.visible = HAS_COMP; scene.add(comp);
const C = {}; C.body = new THREE.Group(); comp.add(C.body);
function hash3(x, y, z) { const v = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return v - Math.floor(v); }
// Codex: nuvem lisa e arredondada (lóbulos achatados), degradê azul → violeta → lavanda e ">_" branco no centro
const CX_A = new THREE.Color(0x1f4dff), CX_B = new THREE.Color(0x7b4dff), CX_C = new THREE.Color(0xf0b8ff);
function cloudLobe(r, cy, cz, sx) {
  const g = new THREE.SphereGeometry(r, 72, 48); g.scale(sx, 1, 1); g.translate(0, cy, cz); const pos = g.attributes.position, col = [];
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), z = pos.getZ(i), t = Math.min(1, Math.max(0, 0.5 + ((y - 1.5) * 0.55 - z * 0.45) / 3.4));
    const c = t < 0.5 ? CX_A.clone().lerp(CX_B, t * 2) : CX_B.clone().lerp(CX_C, (t - 0.5) * 2); col.push(c.r, c.g, c.b);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); return g;
}
const cloudMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.38, metalness: 0.0, emissive: 0x2a2f9a, emissiveIntensity: 0.32 });
{ const lobes = [[1.5, 1.5, 0.0, 0.52]]; for (let k = 0; k < 7; k++) { const an = k / 7 * Math.PI * 2 + 0.3; lobes.push([0.92, 1.5 + Math.sin(an) * 1.38, Math.cos(an) * 1.38, 0.46]); }

C.mesh = C.body;
const cSym = canvasTex(320, 240, (c, w, h) => { c.clearRect(0, 0, w, h); c.strokeStyle = "#ffffff"; c.lineWidth = 34; c.lineCap = "round"; c.lineJoin = "round"; c.beginPath(); c.moveTo(60, 56); c.lineTo(142, 120); c.lineTo(60, 184); c.stroke(); c.beginPath(); c.moveTo(176, 188); c.lineTo(268, 188); c.stroke(); });
C.sym = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 1.72), new THREE.MeshBasicMaterial({ map: cSym.tex, transparent: true })); C.sym.position.set(0.8, 1.5, 0.0); C.sym.rotation.y = Math.PI / 2; C.body.add(C.sym);
if (HAS_COMP) { const cl = new THREE.PointLight(0x8a5cff, 3.0, 10, 1.4); cl.position.set(5.2, 4.2, 1.8); scene.add(cl); }

// ---------- cenários ----------
const R_ = (x) => x;
function bokehCanvas(top, bottom, palette, n, seed) {
  return canvasTex(1024, 848, (c, w, h) => {
    c.fillStyle = top; c.fillRect(0, 0, w, h * 0.55); c.fillStyle = bottom; c.fillRect(0, h * 0.55, w, h * 0.45);
    const r = rng(seed);
    for (let i = 0; i < n; i++) {
      const x = r() * w, y = h * (0.35 + r() * 0.65), rad = 7 + r() * 24, col = palette[Math.floor(r() * palette.length)];
      const g = c.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, col + "ee"); g.addColorStop(0.75, col + "bb"); g.addColorStop(1, col + "00");

function glowMat(hex, k = 1.6) { const m = new THREE.MeshBasicMaterial({ color: hex }); m.color.multiplyScalar(k); return m; }
let bloomK = 0.3;

function buildNight() {

  box(9, 0.05, 6, mat(0x2a3570), 4.5, 0.03, 3.5, scene, { cast: false });
  box(52, 17, 0.4, mat(0x1c2860), 0, 8.5, -4.7); box(0.4, 17, 30, mat(0x172150), -11, 8.5, -2);
  box(52, 0.3, 0.3, mat(0x6b6f8a), 0, 0.15, -4.4, scene, { cast: false });
  const bt = bokehCanvas("#0a1234", "#121c4c", ["#ffd27a", "#fff1c4", "#ff9f5a", "#8fb8ff", "#ff7aa8", "#ffffff", "#ffd27a"], 120, 5);
  const winM = new THREE.MeshBasicMaterial({ map: bt.tex }); winM.color.setRGB(1.25, 1.25, 1.25);
  const wp = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 5.0), winM); wp.position.set(5, 5.2, -4.45); scene.add(wp);
  const fr = mat(0x8b95c4);
  [[5, 2.65, 6.2, 0.3], [5, 7.75, 6.2, 0.3]].forEach(a => box(a[2], a[3], 0.3, fr, a[0], a[1], -4.35));
  [[2.05, 5.2, 0.3, 5.3], [7.95, 5.2, 0.3, 5.3], [5, 5.2, 0.16, 5.3]].forEach(a => box(a[2], a[3], 0.3, fr, a[0], a[1], -4.35));
  box(1.5, 9, 0.35, mat(0x1b2d73), 1.2, 5.5, -4.2); box(1.5, 9, 0.35, mat(0x1b2d73), 8.8, 5.5, -4.2);
  for (let i = 0; i < 18; i++) { const x = -10 + i * 0.62, y = 7.2 - 0.55 * Math.sin(Math.PI * i / 17); box(0.2, 0.28, 0.2, glowMat(0xffc477, 1.9), x, y, -4.15, scene, { cast: false }); }
  box(11, 0.05, 0.05, mat(0x15151c), -4.8, 7.55, -4.2, scene, { cast: false });
  box(10, 1.0, 7.2, mat(0x2b2140), -5.4, 0.5, -0.8); box(9.8, 0.55, 6.9, mat(0x3a4278), -5.4, 1.27, -0.8);
  box(5.8, 0.34, 7.0, mat(0x22307a), -7.8, 1.62, -0.8); box(0.5, 3.2, 7.4, mat(0x241a30), -10.4, 2.0, -0.8); box(1.6, 0.5, 2.3, mat(0xc9ccdf), -9.2, 1.75, -0.2);

function shotFor(sh, k) {
