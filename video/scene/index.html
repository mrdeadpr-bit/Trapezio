// ---------- texturas de pixel (estilo bloco) ----------
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function pixTex(base, vari, { w = 16, h = 16, seed = 1, rep = [1, 1], paint = null } = {}) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); const r = rng(seed); const col = new THREE.Color(base).convertLinearToSRGB();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = 1 + (r() - 0.5) * vari;
    g.fillStyle = `rgb(${Math.min(255, col.r * 255 * k) | 0},${Math.min(255, col.g * 255 * k) | 0},${Math.min(255, col.b * 255 * k) | 0})`;
    g.fillRect(x, y, 1, 1);
  }
  if (paint) paint(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 8;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); return t;
}
const cache = {};
function mat(hex, { vari = 0.14, rough = 0.9, rep = [1, 1], seed = 3, emissive = 0, plain = false, paint = null } = {}) {
  const key = [hex, vari, rough, rep, seed, emissive, plain].join("|"); if (!paint && cache[key]) return cache[key];
  const m = new THREE.MeshStandardMaterial({ map: plain ? null : pixTex(hex, vari, { rep, seed, paint }), color: plain ? hex : 0xffffff, roughness: rough, metalness: 0 });
  if (emissive) { m.emissive = new THREE.Color(hex); m.emissiveIntensity = emissive; if (!plain) m.emissiveMap = m.map; }
  if (!paint) cache[key] = m; return m;
}

}

const SKIN = "#f3d3bd", SKIN_S = "#e6b99f", HAIR = "#17171c", HAIR2 = "#222229", BROW = "#2b1d18";
function faceCanvas() { const c = document.createElement("canvas"); c.width = 16; c.height = 16;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; return { c, g: c.getContext("2d"), t }; }
const UF = faceCanvas();
function px(g, col, x, y, w = 1, h = 1) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function drawUserFace(e, talk, blink) {
  const g = UF.g, r = rng(7);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(g, `rgb(${243 + (r() - .5) * 8 | 0},${211 + (r() - .5) * 8 | 0},${189 + (r() - .5) * 8 | 0})`, x, y);
  // cabelo (franja irregular)
  for (let x = 0; x < 16; x++) { const hh = [4, 4, 3, 4, 3, 3, 2, 3, 4, 3, 3, 2, 3, 4, 4, 4][x]; for (let y = 0; y < hh; y++) px(g, (x + y) % 3 ? HAIR : HAIR2, x, y); }
  for (let y = 4; y < 7; y++) { px(g, HAIR, 0, y); px(g, HAIR, 15, y); }
  // sobrancelhas
  const brow = { flat: [[5, 5, 5, 5], [5, 5, 5, 5]], worry: [[6, 5, 5, 5], [5, 5, 5, 6]], angry: [[5, 5, 6, 6], [6, 6, 5, 5]], high: [[4, 4, 4, 4], [4, 4, 4, 4]], sly: [[5, 5, 5, 5], [4, 4, 4, 4]] }[e.brow] || [[5, 5, 5, 5], [5, 5, 5, 5]];
  brow[0].forEach((y, i) => px(g, BROW, 2 + i, y)); brow[1].forEach((y, i) => px(g, BROW, 10 + i, y));
  // olhos
  const eyes = blink ? "closed" : e.eyes;
  [[2, 1], [10, -1]].forEach(([x0, dir]) => {
    if (eyes === "closed") { px(g, "#3b2a24", x0, 8, 4, 1); if (e.eyes === "closed") px(g, "#3b2a24", x0 + 1, 9, 2, 1); return; }
    const hgt = eyes === "wide" ? 4 : eyes === "half" ? 2 : 3, y0 = eyes === "wide" ? 6 : eyes === "half" ? 8 : 7;
    px(g, "#ffffff", x0, y0, 4, hgt);
    if (eyes === "half") px(g, SKIN_S, x0, y0 - 1, 4, 1);
    const ps = eyes === "wide" ? 1 : 2, pxx = x0 + (dir > 0 ? 2 : 0) + (dir > 0 ? 0 : 0) - (eyes === "wide" ? 0 : 0);
    px(g, "#14141a", Math.min(x0 + 4 - ps, Math.max(x0, x0 + 1 + (e.look || 0))), y0 + (hgt > 2 ? 1 : 0), ps, Math.min(ps, hgt - (hgt > 2 ? 1 : 0)));
  });
  // nariz
  px(g, SKIN_S, 7, 9, 2, 2); px(g, "#d9a98c", 7, 11, 2, 1);
  // bochechas
  if (e.blush) { px(g, "#f2a9a0", 2, 10, 2, 1); px(g, "#f2a9a0", 12, 10, 2, 1); }
  // boca
  const open = Math.min(3, Math.round(talk * 3.2));
  if (open > 0 && e.mouth !== "smile") { px(g, "#5a1f24", 5, 12, 6, open); px(g, "#ffffff", 6, 12, 4, 1); if (open > 1) px(g, "#c4605f", 6, 12 + open - 1, 4, 1); }
  else if (e.mouth === "smile") { px(g, "#8c3f43", 5, 12, 6, 1); px(g, "#8c3f43", 4, 11, 1, 1); px(g, "#8c3f43", 11, 11, 1, 1); if (open) px(g, "#ffffff", 6, 13, 4, 1); }
  else if (e.mouth === "o") { px(g, "#5a1f24", 6, 12, 4, 3); px(g, "#c4605f", 7, 14, 2, 1); }
  else if (e.mouth === "frown") { px(g, "#8c3f43", 5, 13, 6, 1); px(g, "#8c3f43", 4, 14, 1, 1); px(g, "#8c3f43", 11, 14, 1, 1); }
  else px(g, "#9a4a4c", 5, 13, 6, 1);
  if (e.sweat) { px(g, "#7fd0ff", 14, 6, 1, 2); px(g, "#bfe9ff", 14, 6, 1, 1); px(g, "#7fd0ff", 1, 10, 1, 2); }

}
const MF = (() => { const c = document.createElement("canvas"); c.width = 24; c.height = 16;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; return { c, g: c.getContext("2d"), t }; })();
function drawMascotFace(m, blink) {
  const g = MF.g, r = rng(13);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 24; x++) { const k = 1 + (r() - .5) * 0.10; px(g, `rgb(${240 * k | 0},${138 * k | 0},${80 * k | 0})`, x, y); }
  const h = blink ? 1 : (m.big ? 5 : 4), y0 = blink ? 7 : (m.big ? 4 : 5);
  [4, 18].forEach(x0 => { px(g, "#17101a", x0, y0, 2, h);

  px(g, "#d9733f", 10, 11, 4, 1); // focinho discreto
  MF.t.needsUpdate = true;

  c.fillStyle = "#8d8fa0"; c.font = "26px 'DejaVu Sans Mono', monospace"; c.textAlign = "center"; c.fillText("claude — ~/meu-projeto", w / 2, 38); c.textAlign = "left";
  c.fillStyle = "#e0714a"; c.font = "bold 34px 'DejaVu Sans Mono', monospace"; c.fillText("✻ Claude Code", 40, 120);
  c.fillStyle = "#6f7186"; c.font = "26px 'DejaVu Sans Mono', monospace"; c.fillText("/help para ver os comandos", 40, 158);
  const lines = [], banners = []; let footer = "";
  (spec.hist || []).forEach(l => lines.push(l));
  (spec.footer || []).forEach(f => { if (p >= f[0]) footer = f[1]; });
  (spec.events || []).forEach(ev => {
    if (p < ev.f) return;
    if (ev.kind === "line") lines.push([ev.text, ev.color || "#ffffff"]);
    else if (ev.kind === "banner") banners.push(ev);
  });
  c.font = "34px 'DejaVu Sans Mono', monospace"; let y = 235;
  lines.slice(-9).forEach(([tx, col]) => { c.fillStyle = col; c.fillText(tx, 40, y); y += 52; });
  c.strokeStyle = "#4a4c5c"; c.lineWidth = 3; c.strokeRect(28, 610, w - 56, 84);
  c.fillStyle = "#e0714a"; c.fillText(">", 50, 665);
  if (Math.floor(t * 2) % 2 === 0) { c.fillStyle = "#e0714a"; c.fillRect(92, 632, 16, 40); }
  c.fillStyle = "#9a9cae"; c.font = "28px 'DejaVu Sans Mono', monospace"; c.fillText(footer, 40, 735);
  banners.forEach(b => {
    const k = Math.min(1, (p - b.f) * 9); const e = 1 - Math.pow(1 - k, 3);
    c.save(); c.translate(w / 2, 400); c.rotate(-0.2); c.translate((1 - e) * -w, 0);
    c.fillStyle = b.color; c.fillRect(-w, -68, w * 2, 136);
    c.fillStyle = "rgba(0,0,0,.18)"; c.fillRect(-w, 68, w * 2, 8);
    c.fillStyle = "#ffffff"; c.font = "bold 64px 'DejaVu Sans', sans-serif"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(b.text, 0, 6);
    c.restore();
  });
  scrTex.needsUpdate = true;
}

// ---------- expressões ----------
const UEXP = {
  worry: { brow: "worry", eyes: "normal", mouth: "closed", sweat: true }, panic: { brow: "high", eyes: "wide", mouth: "o", sweat: true },
  angry: { brow: "angry", eyes: "normal", mouth: "frown" }, sly: { brow: "sly", eyes: "half", mouth: "smile" },
  happy: { brow: "flat", eyes: "normal", mouth: "smile", blush: true }, neutral: { brow: "flat", eyes: "normal", mouth: "closed" },
};
const MEXP = { neutral: {}, deadpan: { lid: 2 }, smug: { lid: 1 }, happy: { happy: 1 } };

// ---------- pós-processamento ----------
const Q = new URLSearchParams(location.search);
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: +(Q.get('ms') ?? 0) });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 10, aperture: 0.02, maxblur: 0.02 });
composer.addPass(bokeh);
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.32, 0.7, 0.92); composer.addPass(bloom);
const GradeShader = { uniforms: { tDiffuse: { value: null }, time: { value: 0 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 d = (vUv - 0.5); float r2 = dot(d, d);
      float ca = 0.0016 * (0.4 + r2 * 3.0);
      vec3 col = vec3(texture2D(tDiffuse, vUv + d*ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - d*ca).b);
      float l = dot(col, vec3(0.2126,0.7152,0.0722));
      col = mix(col * vec3(0.94,0.99,1.08), col * vec3(1.06,1.0,0.92), smoothstep(0.1, 0.9, l));      // sombras frias, luzes quentes
      col = mix(vec3(l), col, 1.1);
      col *= 1.0 - smoothstep(0.18, 0.62, r2) * 0.55;                                                // vinheta
      col += (hash(vUv * 1080.0 + time) - 0.5) * 0.018;                                              // grão
      gl_FragColor = vec4(col, 1.0);
    }` };
const grade = new ShaderPass(GradeShader); composer.addPass(grade);
composer.addPass(new OutputPass());
const fxaa = new ShaderPass(FXAAShader); fxaa.uniforms.resolution.value.set(1 / W, 1 / H); composer.addPass(fxaa);

// ---------- câmera ----------
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const rotY = (v, a) => V(v.x * Math.cos(a) + v.z * Math.sin(a), v.y, -v.x * Math.sin(a) + v.z * Math.cos(a));
const tmp = new THREE.Vector3();
function worldOf(obj, off = V(0, 0, 0)) { obj.updateWorldMatrix(true, false); return tmp.copy(off).applyMatrix4(obj.matrixWorld).clone(); }
const fwdU = () => V(Math.cos(user.rotation.y), 0, -Math.sin(user.rotation.y));
const fwdM = () => V(Math.cos(mascot.rotation.y), 0, -Math.sin(mascot.rotation.y));

function shotFor(sh, k, t) {
  const sway = V(Math.sin(t * 0.9) * 0.025, Math.sin(t * 1.3) * 0.02, 0);
  const uh = worldOf(U.head), mh = worldOf(M.body, V(0.1, 1.35, 0));
  let pos, look, fov = 36, ap = 0.05;
  if (sh.name === "cuUser") {
    const d = lerp(4.5, 4.0, k); pos = uh.clone().addScaledVector(rotY(fwdU(), sh.a || 0), d).add(V(0, 0.3, 0)); look = uh.clone().add(V(0, 0.55, 0)); ap = 0.12;
  } else if (sh.name === "cuMascot") {
    const d = lerp(5.8, 5.2, k); pos = mh.clone().addScaledVector(rotY(fwdM(), sh.a || 0), d).add(V(0, 0.4, 0)); look = mh.clone().add(V(0, 0.35, 0)); ap = 0.10;
  } else if (sh.name === "two") {
    pos = V(lerp(1.4, 1.2, k), 3.8, lerp(12.0, 11.0, k)); look = V(1.1, 3.2, 0); fov = 48; ap = 0.03;
  } else if (sh.name === "ots") {
    pos = uh.clone().add(V(-2.3 + k * 0.4, 0.9, 3.4)); look = mh.clone().add(V(-0.4, 0.2, 0)); fov = 36; ap = 0.14;
  } else if (sh.name === "screen") {
    const sc = worldOf(lapGroup, V(0.62, 0.55, 0)); const a = sh.a || 0.35, d = lerp(4.3, 3.8, k);
    pos = sc.clone().addScaledVector(rotY(fwdU(), a * 1.2), -d * 0.95).add(V(0, 0.45 + k * 0.1, 0)); look = sc.clone().add(V(0, 0.04, 0)); fov = 28; ap = 0.09;
  } else { pos = V(1.4, 3.6, 13.5); look = V(1.4, 2.9, 0); fov = 40; ap = 0.01; }
  pos.add(sway);
  return { pos, look, fov, ap };
}

// ---------- quadro ----------
window.READY = true;
const capEl = document.getElementById("cap");
window.setT = function (t) {
  const lines = TL.lines; let act = 0;
  lines.forEach((l, i) => { if (t >= l.start - 0.04) act = i; });
  const ln = lines[act], speaking = t >= ln.start - 0.04 && t < ln.end + 0.12;
  const fps = TL.fps, f = (t - ln.start) * fps;
  const amp = speaking && f >= 0 && f < ln.amp.length - 1 ? clamp(Math.max(ln.amp[Math.floor(f)], ln.amp[Math.floor(f) + 1]) * 9) : 0;
  const uTalk = ln.who === "u" ? amp : 0, cTalk = ln.who === "c" ? amp : 0;
  const k = clamp((t - ln.start) / (ln.end - ln.start + 0.2));
  const last = !!ln.last;

  // boneco
  const ue = UEXP[ln.uexp] || UEXP.neutral;
  const blinkU = (t % 3.4) < 0.12;
  drawUserFace(ue, uTalk, blinkU);
  const panic = ln.uexp === "panic" ? 1 : 0;
  U.head.position.y = 2.0 + Math.sin(t * 1.7) * 0.015 + uTalk * 0.03 + (panic ? Math.sin(t * 38) * 0.012 : 0);
  U.head.rotation.z = Math.sin(t * 2.3) * 0.015 + (uTalk > 0.2 ? Math.sin(t * 9) * 0.025 : 0) + (ln.uexp === "worry" ? 0.04 : 0);
  U.head.rotation.x = panic ? Math.sin(t * 31) * 0.02 : 0;
  U.torso.scale.y = 1 + Math.sin(t * 1.7) * 0.01;
  const typing = ln.screen && speaking;
  U.arms.forEach((g, i) => { g.userData.fo.position.y = -0.92 + (typing ? Math.sin(t * 24 + i * 2) * 0.03 : (panic ? Math.sin(t * 30 + i) * 0.02 : 0)); });

  // mascote
  const me = Object.assign({}, MEXP[ln.mexp] || {});
  drawMascotFace(me, (t + 1.3) % 3.9 < 0.11);
  M.body.position.y = Math.abs(Math.sin(t * 9)) * 0.07 * cTalk + Math.sin(t * 2) * 0.01;
  M.body.scale.set(1, 1 - cTalk * 0.03 * Math.abs(Math.sin(t * 9)), 1);
  M.body.rotation.z = cTalk * Math.sin(t * 7) * 0.012;
  M.armR.rotation.x = last ? Math.sin(t * 9) * 0.5 - 1.2 : 0; M.armR.position.y = last ? 1.75 : 1.25;
  M.legs.forEach((l, i) => l.position.y = 0.35 + (cTalk > 0.1 ? Math.max(0, Math.sin(t * 9 + i * 1.6)) * 0.04 : 0));

  // tela
  if (ln.screen) { const s = ln.screen; drawScreen(s, clamp((t - s.cut) / s.seg), t); } else drawScreen({ events: [] }, 0, t);

  // câmera + profundidade de campo
  const sh = shotFor(ln.shot, k, t);
  const screenShot = ln.shot.name === "screen";
  user.children.forEach(c => c.visible = !screenShot || c === lapGroup);
  camera.position.copy(sh.pos); camera.fov = sh.fov; camera.updateProjectionMatrix(); camera.lookAt(sh.look);
  const dist = camera.position.distanceTo(sh.look);
  bokeh.uniforms.focus.value = dist; bokeh.uniforms.aperture.value = sh.ap / Math.max(1, dist) * 0.5; bokeh.uniforms.maxblur.value = 0.018;
  grade.uniforms.time.value = t * 7.0;

  capEl.style.top = screenShot ? "1330px" : "600px";
  capEl.textContent = (t >= ln.start - 0.04 && t < ln.end + 0.25) ? ln.cap : "";
  composer.render();
};
</script>
